<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="http://cdn.tailwind.com"></link>
  <style>
    /* Styling Engine Core Matrix & Resets */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-dark: #04050a;
    --module-surface: rgba(10, 12, 22, 0.75);
    --text-pure: #ffffff;
    --text-muted: #5e6b7e;
    --accent-blue: #3b82f6;
    --kr-glow: #60a5fa;
    --success-green: #10b981;
    --success-bg: rgba(16, 185, 129, 0.1);
    --error-red: #ef4444;
    --error-bg: rgba(239, 68, 68, 0.1);
}

body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-pure);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 5rem;
    /* Soft continuous ambient illumination meshes */
    background-image: 
        radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.04) 0%, transparent 45%),
        radial-gradient(circle at 20% 80%, rgba(96, 165, 250, 0.03) 0%, transparent 45%);
}

/* Fixed Global Navigation Element */
.top-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(4, 5, 10, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    z-index: 100;
}

.nav-container {
    max-width: 1000px;
    width: 90%;
    margin: 0 auto;
    padding: 1.2rem 0;
    display: flex;
    gap: 2rem;
}

.nav-link {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: color 0.2s ease;
}

.nav-link:hover, .nav-link.active {
    color: var(--text-pure);
}

/* App Layout & Alignment Mechanics */
.control-row {
    max-width: 1000px;
    width: 90%;
    margin: 7rem auto 2rem auto;
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--module-surface);
    border: 1px solid rgba(255, 255, 255, 0.04);
    padding: 1.2rem 2rem;
    border-radius: 16px;
    backdrop-filter: blur(10px);
}

.control-row label {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text-pure);
    letter-spacing: -0.01em;
}

/* Premium Styled Custom Selector Controls */
#direction-select {
    background: #0d111c;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #fff;
    padding: 0.5rem 1.5rem 0.5rem 1rem;
    border-radius: 8px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
}

#direction-select:focus {
    border-color: var(--accent-blue);
}

/* Master Action Button Launch Container */
#start {
    max-width: 1000px;
    width: 90%;
    margin: 0 auto 3rem auto;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
}

/* Primary Start Call-to-Action Link Button */
#start a {
    display: inline-block;
    background: linear-gradient(135deg, var(--kr-glow), var(--accent-blue));
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    padding: 0.8rem 2.5rem;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
}

#start a:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
}

/* System Completion Status Badges Override styling tailwind placeholders */
.inline-block {
    display: inline-flex;
    align-items: center;
    padding: 0.4rem 1.2rem;
    border-radius: 99px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
}

.bg-green-100 { background-color: var(--success-bg) !important; color: var(--success-green) !important; border: 1px solid rgba(16, 185, 129, 0.15); }
.bg-red-100 { background-color: var(--error-bg) !important; color: var(--error-red) !important; border: 1px solid rgba(239, 68, 68, 0.15); }

/* Double Column List Structures Wrapper Grid */
.list {
    max-width: 1000px;
    width: 90%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2.5rem;
}

@media (max-width: 820px) {
    .list { grid-template-columns: 1fr; gap: 3rem; }
}

/* Section Structural Column Node Labels */
.section-title {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 2rem;
    letter-spacing: -0.02em;
    color: #ffffff;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding-bottom: 0.75rem;
}

/* Individual Content Display Rows */
.item-row {
    background: var(--module-surface);
    border: 1px solid rgba(255, 255, 255, 0.03);
    border-radius: 20px;
    padding: 2rem;
    margin-bottom: 1.5rem;
    backdrop-filter: blur(10px);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.25s;
}

.item-row:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.08);
}

.item-text {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
}

/* Vocabulary Component Hierarchies Typography */
.kr-text {
    font-size: 1.8rem;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.01em;
}

.pr-text {
    font-size: 0.95rem;
    color: var(--kr-glow);
    font-style: italic;
    font-weight: 500;
}

.en-text {
    font-size: 1.05rem;
    color: var(--text-muted);
    font-weight: 500;
    line-height: 1.5;
    margin-top: 0.25rem;
}

/* Helper descriptor tracking tokens (type / choices metadata fields) */
.c-text {
    font-size: 0.75rem;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: #fff;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    align-self: flex-start;
    margin-top: 0.5rem;
    font-weight: 700;
    text-transform: uppercase;
}

  </style>
</head>

<body>

  <nav class="top-nav">
    <div class="nav-container">
      <a class="nav-link" href="site.html">⇚ Home</a>
      <a class="nav-link" href="tree-diagr.html">⇚ Progress</a>
      <!-- <a class="nav-link" href="two-pointers.html">📚 Study Card</a>
      <a class="nav-link" href="pro-diagra.html"> Practice Card</a>
      <a class="nav-link" href="cp.html">🗣️ Pronunciation Practice</a>-->
      <a class="nav-link active" href="pro-3.html"> Section</a>
    </div>
  </nav>

  <div class="control-row ">
    <label>Speech levels:</label>
    <select id="direction-select">
      <option value="polite">Polite</option>
      <option value="en-kr">Honorifics high</option>
      <option value="casual">Casual</option>
    </select>
  </div>
  <div id="start"> </div>
  <div class="list" id="list">
    <div id="list-phrases" class="list-phrases"></div>
    <div id="list-dictionary" class="list-dictionary"></div>
  </div>

  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const selectedCourse = urlParams.get('section');

    import phraseDataList from './korean.js';
    import phraseDataList2 from './koreanCasual.js';
    import phraseDataList3 from './koreanCasual.js';

    const phraseTab = document.getElementById('list-phrases');
    const dictionaryTab = document.getElementById('list-dictionary');
    const directionSelect = document.getElementById('direction-select');

    const startStudying = document.getElementById('start');
    let speech = directionSelect.value;
    let isDone = phraseDataList.done ? `<p class="inline-block px-3 py-1 rounded-full text-sm font-semibold bg-green-100 text-green-800">Completed</p>`
      : `<p class="inline-block px-3 py-1 rounded-full text-sm font-semibold bg-red-100 text-red-800">Not Completed</p>`


    directionSelect.addEventListener('change', (e) => {
      speech = e.target.value;
      startStudying.innerHTML = `<a class="bg-red-500 hover:bg-red-800 text-slate-200 font-bold 
        py-2.5 px-5 rounded-xl shadow-sm border border-slate-200 mt-6"
        href="study-cards.html?section=${selectedCourse}&s=${speech}">
         Start</a>${isDone}`

      loadPracticeData();
    });

    startStudying.innerHTML = `
      <a class="bg-red-500 hover:bg-red-800 text-slate-200 font-bold py-2.5 px-5 rounded-xl shadow-sm border border-slate-200 mt-6"
      href="study-cards.html?section=${selectedCourse}&s=${speech}"> 
      Start</a>${isDone}`

    function loadPracticeData() {
      // Clear containers and create beautiful native semantic elements
      phraseTab.innerHTML = `<div class="section-title">Courses : ${selectedCourse}</div>`;
      dictionaryTab.innerHTML = `<div class="section-title">Dictionary : ${selectedCourse}</div>`;


      let currentDataSource;
      if (speech === 'polite') {
        currentDataSource = phraseDataList;
        isDone = phraseDataList.done ? `<p class="inline-block px-3 py-1 rounded-full text-sm font-semibold bg-green-100 text-green-800">Completed</p>`
          : `<p class="inline-block px-3 py-1 rounded-full text-sm font-semibold bg-red-100 text-red-800">Not Completed</p>`


      } else if (speech === 'casual') {
        currentDataSource = phraseDataList2;
        isDone = phraseDataList2.done ? `<p class="inline-block px-3 py-1 rounded-full text-sm font-semibold bg-green-100 text-green-800">Completed</p>`
          : `<p class="inline-block px-3 py-1 rounded-full text-sm font-semibold bg-red-100 text-red-800">Not Completed</p>`


      } else if (speech === 'en-kr') {
        currentDataSource = phraseDataList3;
      }

      if (!currentDataSource) return;

      let targetData = [];
      let phraseData = [];

      if (currentDataSource.phrases) {
        targetData = currentDataSource.phrases.filter(course => course.name === selectedCourse);
      }
      if (currentDataSource.dictionary) {
        phraseData = currentDataSource.dictionary.filter(course => course.name === selectedCourse);
      }

      if (targetData && targetData.length > 0) {
        targetData.forEach((item, index) => {
          phraseTab.appendChild(createItemRow(item.phrase, item.pr, item.en, item.choose || "", index, 'phrase'));
        });
      }

      if (phraseData && phraseData.length > 0) {
        phraseData.forEach((item, index) => {
          dictionaryTab.appendChild(createItemRow(item.s, item.pr, item.en, item.type, index, 'dict'));
        });
      }
    }

    function createItemRow(krText, pronunciation, english, choose, index, type) {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="item-text">
          <div class="kr-text">${krText}</div>
          <div class="pr-text">[${pronunciation}]</div>
          <div class="en-text">${english}</div>
          ${choose ? `<div class="c-text">\ ${choose}</div>` : ''}
          <span class="feedback" id="feedback-${type}-${index}"></span>
        </div>
      `;
      return row;
    }

    loadPracticeData();
  </script>
</body>

</html>
